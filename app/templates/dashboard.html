{% extends "base.html" %}
{% block title %}Account · {{ brand.name }}{% endblock %}
{% block content %}
<section class="form-stack" aria-labelledby="dashboard-title">
  <p class="eyebrow">signed in</p>
  <h1 id="dashboard-title">Your account</h1>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <dl class="account">
    <div><dt>Username</dt><dd>{{ user.username }}</dd></div>
    <div><dt>Role</dt><dd>{{ user.role }}</dd></div>
  </dl>
  <p><a class="button" href="/ask">Ask about the client <span aria-hidden="true">→</span></a></p>
  <p><a class="text-link" href="/sessions">Read the session transcripts</a></p>
  <form method="post" action="/logout">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <button class="button" type="submit">Log out</button>
  </form>
</section>
{% endblock %}
